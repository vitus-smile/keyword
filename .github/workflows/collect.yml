name: 키워드 수집

on:
  schedule:
    - cron: '0 */3 * * *'   # 3시간마다 (KST 0·3·6·9·12·15·18·21시)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 수집
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NAVER_HUB_KEY_ID: ${{ secrets.NAVER_HUB_KEY_ID }}
          NAVER_HUB_KEY: ${{ secrets.NAVER_HUB_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: node scripts/collect.mjs
      - name: 커밋·푸시
        # Vercel 이 배포를 막지 않도록 저장소 소유자 noreply 로 커밋
        run: |
          git config user.name "vitus-smile"
          git config user.email "324344486+vitus-smile@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 키워드 수집"
          git pull --rebase
          git push
